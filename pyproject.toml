[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoequi-agent"
version = "0.1.0"
description = "Knowledge-grounded and physically verified phase-equilibrium agent"
readme = "README.md"
requires-python = ">=3.11"
 dependencies = [
  "python-dotenv==1.0.1",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "numpy==2.1.3",
  "pydantic==2.10.3",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "SQLAlchemy==2.0.39",
  "thermo==0.6.1",
  "uvicorn[standard]==0.34.0",
  "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
  phase-engines = [
  "phasepy==0.0.56",
  "pyclapeyron==0.1.1",
  ]
  skills = [
    "sentence-transformers>=2.2.0",
  ]
  dwsim = [
    "pythonnet>=3.0.3",
  ]

  thermoformer = [
    "torch>=2.1,<3",
    "rdkit>=2024.3,<2026",
    "unimol-tools>=0.1.4.post1",
    "scikit-learn>=1.6,<2",
  ]
  dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "pytest-cov==6.0.0",
  "ruff==0.9.3",
]

[project.scripts]
thermoequi = "thermo_engine.cli:main"
thermoequi-seed = "thermo_engine.seed:main"

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "benchmarks*", "database*", "schemas*", "thermo_engine*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider --basetemp=.pytest-tmp"
testpaths = ["tests", "evals"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "evals"]

[[tool.mypy.overrides]]
module = ["phasepy", "phasepy.*", "pyclapeyron", "scipy.*", "thermo", "thermo.*", "yaml"]
ignore_missing_imports = true
