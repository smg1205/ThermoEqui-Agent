name: GHGEAT
aliases:
  - ghgeat
  - ghgeat gamma-infinity
  - ghgeat gamma infinity
family: ml_property_prediction
backend: ghgeat
implementation_status: available
production_ready: false
supported_equilibrium_types:
  - VLE
supported_calculation_types:
  - infinite_dilution_activity
excluded_systems:
  - electrolyte
  - reactive
  - SLE
  - polymer
  - hydrate
  - petroleum_pseudocomponent
  - VLLE
pressure_regime:
  - low
  - moderate
requires_binary_parameters: false
parameter_requirements:
  - Trained GHGEAT checkpoint (GHGEAT_CHECKPOINT) and GHGEAT source tree (GHGEAT_SRC)
  - SMILES for every component on the task
  - torch, torch_geometric, and rdkit optional dependencies
validation_requirements:
  - gamma_infinity_positive
  - gamma_infinity_finite
  - temperature_positive
scope_notes:
  - First-class predictive backend for temperature-dependent infinite-dilution activity coefficients.
  - GHGEAT predicts log-gamma_inf = A + B/T from solute/solvent SMILES and temperature.
  - Independent of binary ParameterSet records; no VLE backend depends on GHGEAT.
  - Does not implement bubble/dew/flash; those requests fail with unsupported_model.
  - production_ready remains false until experimental benchmark closure and applicability review.
optional_dependency: torch, torch_geometric, rdkit
source_refs:
  - knowledge/model_cards/ghgeat.yaml
  - thermo_engine/registry.py
  - thermo_engine/ghgeat_backend.py
  - tests/test_ghgeat_backend.py
